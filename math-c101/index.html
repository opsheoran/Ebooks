<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=../math-cc-101/index.html">
    <title>Redirecting to MATH-CC-101...</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.png">

<style>
/* ── SECTION CARD PREV / NEXT NAVIGATION BUTTONS (APPLICATION THEME) ── */
.section-card-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 2px dashed var(--border, #DDD8CF);
    gap: 12px;
}
.sec-nav-btn {
    background: linear-gradient(135deg, var(--navy, #1B2A4A) 0%, var(--navy-light, #2E4270) 100%) !important;
    color: #ffffff !important;
    border: 1px solid var(--gold, #C8922A) !important;
    padding: 8px 20px !important;
    border-radius: 20px !important;
    font-family: 'DM Sans', sans-serif !important;
    font-size: 0.85rem !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    transition: all 0.25s ease !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    box-shadow: 0 2px 8px rgba(27,42,74,0.18) !important;
}
.sec-nav-btn:hover {
    background: linear-gradient(135deg, var(--gold, #C8922A) 0%, var(--gold-light, #E8B84B) 100%) !important;
    color: #1B2A4A !important;
    border-color: var(--gold-light, #E8B84B) !important;
    transform: translateY(-2px) !important;
    box-shadow: 0 4px 16px rgba(200,146,42,0.4) !important;
}
.sec-nav-btn:disabled, .sec-nav-btn.disabled {
    opacity: 0.45 !important;
    cursor: not-allowed !important;
    transform: none !important;
    box-shadow: none !important;
}
</style>

<!-- UNIFIED GLOBAL EBOOK CONTROLLER -->
<script>
    window.currentLang = window.currentLang || 'en';

    function showSection(id) {
        if (!id) return;
        document.querySelectorAll('.page-section, .topic-section').forEach(s => {
            if (s.id) {
                s.classList.remove('active');
                s.style.display = 'none';
            }
        });

        const target = document.getElementById(id);
        if (target) {
            target.classList.add('active');
            target.style.display = 'block';
        }

        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const activeLink = document.querySelector(`.nav-link[onclick*="${id}"], .nav-link[href="#${id}"]`);
        if (activeLink) activeLink.classList.add('active');

        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.innerWidth <= 768) {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sb) sb.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
        }

        if (window.MathJax && MathJax.typesetPromise && target) {
            MathJax.typesetPromise([target]).catch(function(err){});
        }
    }
    window.showSection = showSection;
    window.showTopic = showSection;

    function navigateSection(direction) {
        const sections = Array.from(document.querySelectorAll('section.page-section, section.topic-section'));
        if (!sections.length) return;

        let currentIndex = sections.findIndex(sec => sec.classList.contains('active') || sec.style.display === 'block');
        if (currentIndex === -1) currentIndex = 0;

        let targetIndex = currentIndex + direction;

        if (targetIndex >= 0 && targetIndex < sections.length) {
            const targetSecId = sections[targetIndex].id;
            showSection(targetSecId);
        }
    }
    window.navigateSection = navigateSection;

    function toggleAnswer(id) {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.classList.contains('show') || el.style.display === 'block') {
            el.classList.remove('show');
            el.style.display = 'none';
        } else {
            el.classList.add('show');
            el.style.display = 'block';
        }
    }
    window.toggleAnswer = toggleAnswer;
    window.toggleAnswers = toggleAnswer;
    window.toggleSetAnswers = toggleAnswer;

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        let overlay = document.getElementById('sidebar-overlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'sidebar-overlay';
            overlay.className = 'sidebar-overlay';
            overlay.onclick = toggleSidebar;
            document.body.appendChild(overlay);
        }
        if (sb) {
            sb.classList.toggle('open');
            if (sb.classList.contains('open')) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }
    }
    window.toggleSidebar = toggleSidebar;

    function toggleLanguage() {
        const btnText = document.getElementById('lang-toggle-text');
        const engContents = document.querySelectorAll('.english-content');
        const hinContents = document.querySelectorAll('.hinglish-content');
        
        if (window.currentLang === 'en') {
            if (btnText) btnText.innerHTML = '<i class="fas fa-language"></i> Switch Language (English)';
            engContents.forEach(el => el.style.display = 'none');
            hinContents.forEach(el => el.style.display = 'block');
            window.currentLang = 'hi';
        } else {
            if (btnText) btnText.innerHTML = '<i class="fas fa-language"></i> Switch Language (Hinglish)';
            hinContents.forEach(el => el.style.display = 'none');
            engContents.forEach(el => el.style.display = 'block');
            window.currentLang = 'en';
        }
    }
    window.toggleLanguage = toggleLanguage;
</script>
</head>
<body>
    <p>Redirecting to <a href="../math-cc-101/index.html">../math-cc-101/index.html</a>...</p>
</body>
</html>
