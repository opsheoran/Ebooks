<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Pro Canvas | E-Books Library</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Whiteboard CSS -->
    <link rel="stylesheet" href="whiteboard.css?v=2.0">
    <style>

        /* ============================================================
           DESIGN SYSTEM — Professional Textbook
           Palette: Deep Navy · Warm Ivory · Golden Amber · Sage Green
        ============================================================ */
        :root {
            --navy:          #1B2A4A;
            --navy-mid:      #243555;
            --navy-light:    #2E4270;
            --gold:          #C8922A;
            --gold-light:    #E8B84B;
            --gold-pale:     #FDF3DC;
            --sage:          #3D6B5A;
            --sage-light:    #EEF6F2;
            --crimson:       #9B2335;
            --crimson-light: #FBF0F1;
            --sky:           #1D6FA4;
            --sky-light:     #EAF4FB;
            --ivory:         #FAFAF7;
            --paper:         #F5F3EE;
            --border:        #DDD8CF;
            --text-dark:     #1C1C1E;
            --text-mid:      #3A3A3C;
            --text-soft:     #6B6B70;
            --sidebar-w:     300px;
            --header-h:      72px;
            --radius:        10px;
            --shadow-sm:     0 2px 8px rgba(27,42,74,.08);
            --shadow-md:     0 4px 20px rgba(27,42,74,.12);
            --shadow-lg:     0 8px 40px rgba(27,42,74,.16);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--paper);
            color: var(--text-dark);
            line-height: 1.78;
            font-size: 16px;
        }

        /* ── TOP HEADER ───────────────────────────────────────────── */
        .book-header {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--header-h);
            background: var(--navy);
            background: linear-gradient(110deg, var(--navy) 0%, var(--navy-mid) 50%, var(--navy-light) 100%);
            color: #fff;
            z-index: 1100;
            box-shadow: 0 3px 20px rgba(0,0,0,.25);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 16px;
        }

        .book-header .menu-toggle {
            display: none;
            background: none; border: none;
            color: #fff; font-size: 1.3rem; cursor: pointer;
            padding: 4px 8px;
        }

        .header-icon {
            width: 42px; height: 42px;
            background: var(--gold);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }

        .header-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem; font-weight: 700;
            letter-spacing: .3px;
            color: #fff;
        }

        .header-text .subtitle {
            font-family: 'DM Sans', sans-serif;
            font-size: .8rem;
            color: rgba(255,255,255,.7);
            letter-spacing: .5px;
        }

        .header-badge {
            margin-left: auto;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.2);
            color: rgba(255,255,255,.9);
            font-family: 'DM Sans', sans-serif;
            font-size: .75rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: .4px;
        }

        /* ── SIDEBAR ──────────────────────────────────────────────── */
        .sidebar {
            position: fixed;
            left: 0; top: var(--header-h);
            width: var(--sidebar-w);
            height: calc(100vh - var(--header-h));
            background: var(--navy);
            overflow-y: auto;
            z-index: 1000;
            transition: transform .3s ease;
            scrollbar-width: thin;
            scrollbar-color: rgba(200,146,42,.4) transparent;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(200,146,42,.4); border-radius: 4px; }

        .sidebar-brand {
            padding: 20px 20px 14px;
            border-bottom: 1px solid rgba(255,255,255,.1);
            background: linear-gradient(180deg, rgba(200,146,42,.15) 0%, transparent 100%);
        }

        .sidebar-brand h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gold-light);
            margin-bottom: 3px;
        }

        .sidebar-author {
            padding: 20px 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-photo {
            width: 44px; height: 44px;
            border-radius: 50%;
            object-fit: cover;
            object-position: top;
            border: 2px solid var(--gold);
        }

        .sidebar-author-info h3 {
            font-size: 0.9rem;
            color: #fff;
            margin: 0;
            font-family: 'Playfair Display', serif;
        }

        .sidebar-author-info p {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.6);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-brand p {
            font-family: 'DM Sans', sans-serif;
            font-size: .78rem;
            color: rgba(255,255,255,.55);
            line-height: 1.4;
        }

        .nav-group-label {
            font-family: 'DM Sans', sans-serif;
            font-size: .68rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255,255,255,.35);
            padding: 16px 20px 6px;
        }

        .nav-list { list-style: none; padding: 0 8px 12px; }

        .nav-item { margin: 1px 0; }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            color: rgba(255,255,255,.75);
            text-decoration: none;
            border-radius: 7px;
            font-family: 'DM Sans', sans-serif;
            font-size: .875rem;
            font-weight: 400;
            transition: all .2s ease;
            border-left: 3px solid transparent;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(255,255,255,.08);
            color: #fff;
            border-left-color: rgba(200,146,42,.6);
        }

        .nav-link.active {
            background: rgba(200,146,42,.18);
            color: var(--gold-light);
            border-left-color: var(--gold);
            font-weight: 500;
        }

        .nav-link .nav-num {
            font-size: .7rem;
            background: rgba(255,255,255,.12);
            border-radius: 4px;
            padding: 1px 6px;
            font-weight: 600;
            min-width: 26px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-link.active .nav-num {
            background: var(--gold);
            color: var(--navy);
        }

        .nav-sub .nav-link {
            padding-left: 28px;
            font-size: .835rem;
            color: rgba(255,255,255,.55);
        }

        .nav-sub .nav-link:hover,
        .nav-sub .nav-link.active {
            color: var(--gold-light);
        }

        /* ── MAIN CONTENT ─────────────────────────────────────────── */
        .main-content {
            margin-left: var(--sidebar-w);
            margin-top: var(--header-h);
            padding: 36px 48px 60px;
            max-width: calc(var(--sidebar-w) + 860px);
            min-height: calc(100vh - var(--header-h));
        }

        /* ── PAGE HEADER (chapter intro) ──────────────────────────── */
        .chapter-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: #fff;
            padding: 32px 36px;
            border-radius: var(--radius);
            margin-bottom: 32px;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .chapter-header::before {
            content: '';
            position: absolute; top: -30px; right: -30px;
            width: 180px; height: 180px;
            background: rgba(200,146,42,.12);
            border-radius: 50%;
        }

        .chapter-header::after {
            content: '';
            position: absolute; bottom: -50px; right: 60px;
            width: 120px; height: 120px;
            background: rgba(200,146,42,.07);
            border-radius: 50%;
        }

        .chapter-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.1rem;
            font-weight: 900;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .chapter-header .author {
            font-family: 'DM Sans', sans-serif;
            font-size: .95rem;
            color: rgba(255,255,255,.7);
            margin-bottom: 14px;
            font-style: italic;
        }

        .chapter-header .syllabus-tag {
            display: inline-block;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 6px;
            padding: 10px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: .82rem;
            line-height: 1.6;
            color: rgba(255,255,255,.85);
            position: relative;
            z-index: 1;
        }

        /* ── TOPIC SECTION SHOW/HIDE ──────────────────────────────── */
        .topic-section {
            display: none;
            animation: fadeSlideIn .45s ease;
        }

        .topic-section.active { display: block; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── SECTION CARD ─────────────────────────────────────────── */
        .section-card {
            background: var(--ivory);
            border-radius: var(--radius);
            padding: 36px 42px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            border-top: 4px solid var(--navy);
        }

        /* ── TYPOGRAPHY ───────────────────────────────────────────── */
        .section-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--navy);
            margin: 0 0 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border);
            display: flex; align-items: baseline; gap: 10px;
        }

        .section-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--navy-light);
            margin: 32px 0 14px;
        }

        .section-card h4 {
            font-family: 'DM Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-dark);
            margin: 20px 0 8px;
        }

        .section-card h5 {
            font-family: 'DM Sans', sans-serif;
            font-size: .95rem;
            font-weight: 500;
            color: var(--sky);
            margin: 14px 0 6px;
            font-style: italic;
        }

        .section-card p {
            margin-bottom: 12px;
            text-align: justify;
            font-size: 1.02rem;
            color: var(--text-mid);
            line-height: 1.82;
        }

        .section-card ul,
        .section-card ol {
            margin: 10px 0 14px 28px;
            line-height: 1.75;
        }

        .section-card li {
            margin-bottom: 5px;
            color: var(--text-mid);
            font-size: .99rem;
        }

        .section-num {
            font-family: 'DM Sans', sans-serif;
            font-size: .9rem;
            font-weight: 700;
            background: var(--navy);
            color: var(--gold-light);
            padding: 2px 10px;
            border-radius: 5px;
            flex-shrink: 0;
        }

        /* ── CALLOUT BOXES ────────────────────────────────────────── */
        .definition, .theorem, .example, .note, .warning, .key-point {
            border-radius: 8px;
            padding: 18px 22px;
            margin: 20px 0;
            position: relative;
        }

        .definition {
            background: #F3F0FB;
            border-left: 5px solid #6B4FC8;
            box-shadow: 0 2px 10px rgba(107,79,200,.1);
        }

        .definition h4::before { content: "Definition — "; color: #6B4FC8; }

        .theorem {
            background: var(--sage-light);
            border-left: 5px solid var(--sage);
            box-shadow: 0 2px 10px rgba(61,107,90,.1);
        }

        .theorem h4::before { content: "Theorem — "; color: var(--sage); }

        .example {
            background: #FFFBF0;
            border-left: 5px solid var(--gold);
            box-shadow: 0 2px 10px rgba(200,146,42,.1);
        }

        .example h4::before { content: ""; }

        .note {
            background: var(--sky-light);
            border-left: 5px solid var(--sky);
            box-shadow: 0 2px 10px rgba(29,111,164,.1);
        }

        .note h4::before { content: "📘 "; }

        .warning {
            background: var(--crimson-light);
            border-left: 5px solid var(--crimson);
            color: #5a1020;
            box-shadow: 0 2px 10px rgba(155,35,53,.1);
        }

        .warning strong { color: var(--crimson); }

        .key-point {
            background: linear-gradient(135deg, #EAF8F4 0%, #E0F3FF 100%);
            border-left: 5px solid #0E9E6F;
            box-shadow: 0 2px 10px rgba(14,158,111,.1);
        }

        .key-point strong { color: #0E6650; }

        .definition h4, .theorem h4, .example h4,
        .note h4, .warning h4, .key-point h4 {
            margin-top: 0; margin-bottom: 8px;
            color: var(--text-dark);
        }

        /* ── FORMULA BOX ──────────────────────────────────────────── */
        .formula-box {
            background: linear-gradient(135deg, #EEF2FA 0%, #F7F5FF 100%);
            border: 2px dashed var(--navy-light);
            border-radius: 8px;
            padding: 18px 22px;
            margin: 16px 0;
            text-align: center;
            font-size: 1.12rem;
        }

        /* ── DERIVATION & PROOF ───────────────────────────────────── */
        .derivation {
            background: #F8FAFC;
            border-left: 3px solid var(--sky);
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 0 6px 6px 0;
            font-family: 'Source Serif 4', serif;
            line-height: 1.85;
            color: var(--text-mid);
        }

        .proof-step {
            margin: 5px 0 5px 20px;
            padding-left: 12px;
            border-left: 2px solid var(--border);
            color: var(--text-mid);
            font-size: .97rem;
        }

        /* ── TABLES ───────────────────────────────────────────────── */
        /* Stat-CC-101 Compact & Centered Table System */
table, .calculation-data {
    width: auto !important;
    max-width: 95% !important;
    margin: 24px auto !important;
    border-collapse: separate !important;
    border-spacing: 0 !important;
    border-radius: 8px !important;
    overflow: hidden !important;
    box-shadow: 0 2px 8px rgba(27, 42, 74, 0.08) !important;
    background: #ffffff !important;
    display: table !important;
    border: 1px solid var(--border) !important;
}

th {
    background: var(--navy) !important;
    color: #ffffff !important;
    padding: 8px 16px !important;
    font-family: 'DM Sans', sans-serif !important;
    font-size: 0.88rem !important;
    font-weight: 600 !important;
    letter-spacing: 0.3px !important;
    text-align: center !important;
    border-bottom: 2px solid var(--gold) !important;
}

td {
    padding: 6px 16px !important;
    border-bottom: 1px solid var(--border) !important;
    font-size: 0.88rem !important;
    color: var(--text-dark) !important;
    text-align: center !important;
}

tr:nth-child(even) td {
    background: #fcfbf9 !important;
}

tr:hover td {
    background: var(--gold-pale) !important;
    transition: background 0.15s ease !important;
}

        /* ── VENN DIAGRAMS ────────────────────────────────────────── */
        .venn-container {
            display: flex;
            justify-content: center;
            margin: 18px 0;
            padding: 16px;
            background: #F8FAFC;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .venn-diagram { width: 300px; height: 200px; }
        .venn-diagram svg { width: 100%; height: 100%; }

        .venn-circle {
            fill-opacity: .38;
            stroke: #334;
            stroke-width: 2;
        }

        .venn-label {
            font-family: 'Source Serif 4', serif;
            font-size: 14px;
            font-weight: 600;
            fill: #1B2A4A;
        }

        .venn-shaded {
            fill: rgba(59,130,246,.55);
            stroke: #1e40af;
            stroke-width: 2;
        }

        /* ── EXERCISE SECTIONS ────────────────────────────────────── */
        .exercise-section {
            background: transparent;
            border-left: none;
            box-shadow: none;
            padding: 0;
        }

        .exercise-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: #fff;
            padding: 24px 30px;
            border-radius: 10px 10px 0 0;
            margin-bottom: 0;
        }

        .exercise-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #fff;
            border: none;
            padding: 0; margin: 0 0 4px;
        }

        .exercise-header p {
            font-family: 'DM Sans', sans-serif;
            font-size: .85rem;
            color: rgba(255,255,255,.7);
            margin: 0;
        }

        .question {
            background: #fff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--navy-light);
            padding: 16px 20px;
            margin: 14px 0 6px;
            border-radius: 0 8px 8px 0;
            font-size: 1rem;
            color: var(--text-dark);
            line-height: 1.7;
        }

        .question strong { color: var(--navy); }

        /* ── TOGGLE ANSWER BUTTON ─────────────────────────────────── */
        .toggle-btn {
            background: var(--navy);
            color: #fff;
            border: none;
            padding: 7px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: .82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all .25s;
            margin: 4px 0 8px;
            letter-spacing: .3px;
        }

        .toggle-btn:hover {
            background: var(--navy-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(27,42,74,.3);
        }

        /* ── ANSWER REVEAL ────────────────────────────────────────── */
        .answer {
            display: none;
            background: #F0FBF5;
            border-left: 4px solid var(--sage);
            padding: 16px 20px;
            margin: 2px 0 12px;
            border-radius: 0 8px 8px 0;
            animation: fadeSlideIn .3s ease;
            color: var(--text-dark) !important;
            font-size: .97rem;
            line-height: 1.75;
        }

        .answer.show { display: block; }

        .answer p, .answer ul, .answer ol,
        .answer li, .answer strong, .answer em,
        .answer .derivation, .answer .proof-step {
            color: var(--text-dark) !important;
        }

        .answer .derivation {
            background: #EFF8F4;
            border-left-color: var(--sage);
            color: var(--text-dark) !important;
        }

        .answer strong { font-weight: 700; }

        /* ── MCQ OPTIONS ──────────────────────────────────────────── */
        .mcq-options { margin: 10px 0 8px 20px; }
        .mcq-options label {
            display: block;
            margin: 5px 0;
            cursor: pointer;
            font-size: .95rem;
            color: var(--text-mid);
            line-height: 1.6;
        }
        .mcq-options input { margin-right: 8px; accent-color: var(--navy); }

        /* ── ANSWER KEY BOX ───────────────────────────────────────── */
        .answer-key {
            background: rgba(255,255,255,.15);
            padding: 14px 18px;
            border-radius: 7px;
            margin-top: 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: .88rem;
            line-height: 1.8;
        }

        .answer-key strong { color: var(--gold-light); }

        /* ── BADGE ────────────────────────────────────────────────── */
        .badge {
            display: inline-block;
            background: var(--crimson);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: .75rem;
            font-weight: 600;
            margin-left: 8px;
        }

        /* ── QUICK REF TABLE ──────────────────────────────────────── */
        .quick-ref-table th { background: var(--navy-light); }

        /* ── FOOTER ───────────────────────────────────────────────── */
        .book-footer {
            background: var(--navy);
            color: rgba(255,255,255,.75);
            text-align: center;
            padding: 24px;
            margin-top: 48px;
            border-radius: 12px 12px 0 0;
            font-family: 'DM Sans', sans-serif;
            font-size: .88rem;
            line-height: 1.7;
        }

        .book-footer strong { color: var(--gold-light); }
        .book-footer .university {
            margin-top: 6px;
            font-size: .82rem;
            opacity: .7;
        }

        /* ── MATHJAX ──────────────────────────────────────────────── */
        .MathJax { font-size: 1.06em !important; }
        mjx-container { display: inline-block !important; }

        /* ── SCROLLBAR ────────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: var(--paper); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b0a89a; }

        /* ── RESPONSIVE ───────────────────────────────────────────── */
        @media (max-width: 1024px) {
            :root { --sidebar-w: 260px; }
            .main-content { padding: 28px 30px 50px; }
        }

        @media (max-width: 768px) {
            :root { --sidebar-w: 280px; }
            .book-header .menu-toggle { display: flex; align-items: center; justify-content: center; }
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .main-content {
                margin-left: 0;
                padding: 20px 18px 40px;
                max-width: 100%;
            }
            .chapter-header h1 { font-size: 1.6rem; }
            .section-card { padding: 22px 20px; }
        }

        /* ── EXERCISE SECTION OVERRIDES ──────────────────────────── */
        .section-card .exercise-section {
            background: transparent;
            padding: 0;
        }

        .section-card h2:has(.section-num) + * { margin-top: 8px; }

        /* Progress bar decoration for exercise headers */
        .section-card > h2 {
            position: relative;
        }
    

/* Additional Course Portal & Language Toggle Enhancements */
.chapter-header { position: relative; }
.header-lang-toggle {
    position: absolute; top: 20px; right: 30px;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff; padding: 6px 14px; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: all 0.3s;
    display: inline-flex; align-items: center; gap: 6px;
}
.header-lang-toggle:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

.course-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 25px;
    margin-top: 30px;
}

.unit-card {
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    padding: 30px;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

.unit-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--gold) 100%);
}

.unit-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-md);
    border-color: var(--gold);
}

.unit-badge {
    display: inline-block;
    background: var(--gold-pale);
    color: var(--navy);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 15px;
    margin-bottom: 15px;
    width: fit-content;
}

.unit-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--navy);
    margin-bottom: 12px;
}

.unit-card p {
    font-family: 'Source Serif 4', serif;
    font-size: 0.95rem;
    color: var(--text-mid);
    line-height: 1.6;
    margin-bottom: 20px;
    flex-grow: 1;
}

.unit-stats {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--text-soft);
    border-top: 1px solid var(--border);
    padding-top: 15px;
}

.unit-stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn-read {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--navy);
    color: #ffffff;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.btn-read:hover {
    background: var(--gold);
    color: var(--navy);
}

    
/* Compact & Centered Figure / Graph System */
.figure-box, .chart-container, .graph-container {
    width: auto !important;
    max-width: 560px !important;
    margin: 28px auto !important;
    padding: 20px !important;
    background: #ffffff !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    box-shadow: 0 4px 16px rgba(27, 42, 74, 0.08) !important;
    text-align: center !important;
    display: block !important;
}

.figure-title {
    font-family: 'Playfair Display', serif !important;
    font-size: 1.05rem !important;
    font-weight: 700 !important;
    color: var(--navy) !important;
    margin-bottom: 12px !important;
    text-align: center !important;
}

.figure-caption {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 0.85rem !important;
    color: var(--text-soft) !important;
    margin-top: 10px !important;
    font-style: italic !important;
    text-align: center !important;
}

svg.book-fig, .figure-box svg, canvas {
    display: block !important;
    margin: 0 auto !important;
    max-width: 100% !important;
    height: auto !important;
}

    
        /* ── RESPONSIVE MOBILE & SIDEBAR DRAWER SYSTEM ── */
        body { overflow-x: hidden; }

        .sidebar-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(17, 27, 48, 0.65); backdrop-filter: blur(3px);
            z-index: 999; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        mjx-container, .MathJax_Display, table, .table-container, .formula-box, .math-scroll {
            max-width: 100% !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 1024px) {
            :root { --sidebar-w: 250px; }
            .main-content { padding: 28px 24px 60px; }
            .unit-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        }

        @media (max-width: 768px) {
            :root { --sidebar-w: 280px; --header-h: 64px; }
            .book-header { padding: 0 14px; gap: 8px; }
            .book-header .menu-toggle {
                display: flex !important; align-items: center; justify-content: center;
                background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
                color: #fff; font-size: 1.25rem; padding: 6px 12px; border-radius: 8px; cursor: pointer;
            }
            .header-text h1 { font-size: 1.05rem !important; }
            .header-text .subtitle { display: none !important; }
            .header-badge { display: none !important; }
            .draw-mode-toggle, .calc-mode-toggle, .header-lang-toggle { padding: 5px 10px !important; font-size: 0.76rem !important; }

            .sidebar {
                position: fixed !important; left: 0 !important; top: var(--header-h) !important;
                width: var(--sidebar-w) !important; height: calc(100vh - var(--header-h)) !important;
                transform: translateX(-100%) !important; box-shadow: 4px 0 25px rgba(0,0,0,0.3) !important;
                z-index: 1000 !important; transition: transform 0.3s ease !important;
            }
            .sidebar.open { transform: translateX(0) !important; }

            .main-content { margin-left: 0 !important; padding: 18px 14px 50px !important; max-width: 100% !important; }
            .hero-banner { padding: 22px 18px !important; }
            .hero-banner h1 { font-size: 1.7rem !important; }
            .section-card { padding: 20px 16px !important; }
            .author-card { flex-direction: column !important; text-align: center !important; padding: 18px 14px !important; }
            .stats-row { grid-template-columns: repeat(2, 1fr) !important; }
        }

<script>
window.navigateSection = function(direction) {
    const sections = Array.from(document.querySelectorAll('section.page-section'));
    if (!sections.length) return;

    let currentIndex = sections.findIndex(sec => sec.classList.contains('active'));
    if (currentIndex === -1) currentIndex = 0;

    let targetIndex = currentIndex + direction;

    if (targetIndex >= 0 && targetIndex < sections.length) {
        const targetSecId = sections[targetIndex].id;
        if (typeof window.showSection === 'function') {
            window.showSection(targetSecId);
        } else if (typeof showSection === 'function') {
            showSection(targetSecId);
        } else {
            sections.forEach(s => s.classList.remove('active'));
            sections[targetIndex].classList.add('active');
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
};
</script>

<script>
function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            let overlay = document.getElementById('sidebar-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'sidebar-overlay';
                overlay.className = 'sidebar-overlay';
                overlay.onclick = toggleSidebar;
                document.body.appendChild(overlay);
            }
            if (sb) {
                sb.classList.toggle('open');
                if (sb.classList.contains('open')) {
                    overlay.classList.add('active');
                } else {
                    overlay.classList.remove('active');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.sidebar .nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        const sb = document.getElementById('sidebar');
                        const overlay = document.getElementById('sidebar-overlay');
                        if (sb && sb.classList.contains('open')) {
                            sb.classList.remove('open');
                            if (overlay) overlay.classList.remove('active');
                        }
                    }
                });
            });
        });
/* ── FEATURE B: SECTION CARD PREV / NEXT NAVIGATION CONTROLLER ── */
        function navigateSection(direction) {
            const sections = Array.from(document.querySelectorAll('section.page-section'));
            if (!sections.length) return;

            let currentIndex = sections.findIndex(sec => sec.classList.contains('active'));
            if (currentIndex === -1) currentIndex = 0;

            let targetIndex = currentIndex + direction;

            if (targetIndex >= 0 && targetIndex < sections.length) {
                const targetSecId = sections[targetIndex].id;
                if (typeof showSection === 'function') {
                    showSection(targetSecId);
                } else {
                    sections.forEach(s => s.classList.remove('active'));
                    sections[targetIndex].classList.add('active');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

    </script>
