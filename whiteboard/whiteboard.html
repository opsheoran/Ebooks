<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Pro Canvas | E-Books Library</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Whiteboard CSS -->
    <link rel="stylesheet" href="whiteboard.css?v=2.0">
    <style>
        body {
            background-color: #F5F3EE;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Source Serif 4', serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #1B2A4A;
        }
        .draw-mode-toggle {
            background: #1B2A4A;
            color: #fff;
            border: 2px solid #C8922A;
            border-radius: 20px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(27,42,74,.12);
            transition: all 0.3s ease;
        }
        .draw-mode-toggle:hover {
            background: #2E4270;
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(27,42,74,.16);
        }
        /* Make popup full size automatically for standalone page */
        .whiteboard-popup {
            width: 95vw !important;
            height: 95vh !important;
        }
    
        /* ── RESPONSIVE MOBILE & SIDEBAR DRAWER SYSTEM ── */
        body { overflow-x: hidden; }

        .sidebar-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(17, 27, 48, 0.65); backdrop-filter: blur(3px);
            z-index: 999; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        table, .table-container, .formula-box, .math-scroll {
            max-width: 100% !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 1024px) {
            :root { --sidebar-w: 250px; }
            .main-content { padding: 28px 24px 60px; }
            .unit-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        }

        @media (max-width: 768px) {
            :root { --sidebar-w: 280px; --header-h: 64px; }
            .book-header { padding: 0 14px; gap: 8px; }
            .book-header .menu-toggle {
                display: flex !important; align-items: center; justify-content: center;
                background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
                color: #fff; font-size: 1.25rem; padding: 6px 12px; border-radius: 8px; cursor: pointer;
            }
            .header-text h1 { font-size: 1.05rem !important; }
            .header-text .subtitle { display: none !important; }
            .header-badge { display: none !important; }
            .draw-mode-toggle, .calc-mode-toggle, .header-lang-toggle { padding: 5px 10px !important; font-size: 0.76rem !important; }

            .sidebar {
                position: fixed !important; left: 0 !important; top: var(--header-h) !important;
                width: var(--sidebar-w) !important; height: calc(100vh - var(--header-h)) !important;
                transform: translateX(-100%) !important; box-shadow: 4px 0 25px rgba(0,0,0,0.3) !important;
                z-index: 1000 !important; transition: transform 0.3s ease !important;
            }
            .sidebar.open { transform: translateX(0) !important; }

            .main-content { margin-left: 0 !important; padding: 18px 14px 50px !important; max-width: 100% !important; }
            .hero-banner { padding: 22px 18px !important; }
            .hero-banner h1 { font-size: 1.7rem !important; }
            .section-card { padding: 20px 16px !important; }
            .author-card { flex-direction: column !important; text-align: center !important; padding: 18px 14px !important; }
            .stats-row { grid-template-columns: repeat(2, 1fr) !important; }
        }

    
/* ── SECTION CARD PREV / NEXT NAVIGATION BUTTONS (APPLICATION THEME) ── */
.section-card-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 2px dashed var(--border, #DDD8CF);
    gap: 12px;
}
.sec-nav-btn {
    background: linear-gradient(135deg, var(--navy, #1B2A4A) 0%, var(--navy-light, #2E4270) 100%) !important;
    color: #ffffff !important;
    border: 1px solid var(--gold, #C8922A) !important;
    padding: 8px 20px !important;
    border-radius: 20px !important;
    font-family: 'DM Sans', sans-serif !important;
    font-size: 0.85rem !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    transition: all 0.25s ease !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    box-shadow: 0 2px 8px rgba(27,42,74,0.18) !important;
}
.sec-nav-btn:hover {
    background: linear-gradient(135deg, var(--gold, #C8922A) 0%, var(--gold-light, #E8B84B) 100%) !important;
    color: #1B2A4A !important;
    border-color: var(--gold-light, #E8B84B) !important;
    transform: translateY(-2px) !important;
    box-shadow: 0 4px 16px rgba(200,146,42,0.4) !important;
}
.sec-nav-btn:disabled, .sec-nav-btn.disabled {
    opacity: 0.45 !important;
    cursor: not-allowed !important;
    transform: none !important;
    box-shadow: none !important;
}

    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.png">


<!-- UNIFIED GLOBAL EBOOK CONTROLLER -->
<script>
    window.currentLang = window.currentLang || 'en';

    function showSection(id) {
        if (!id) return;
        document.querySelectorAll('.page-section, .topic-section').forEach(s => {
            if (s.id) {
                s.classList.remove('active');
                s.style.display = 'none';
            }
        });

        const target = document.getElementById(id);
        if (target) {
            target.classList.add('active');
            target.style.display = 'block';
        }

        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const activeLink = document.querySelector(`.nav-link[onclick*="${id}"], .nav-link[href="#${id}"]`);
        if (activeLink) activeLink.classList.add('active');

        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.innerWidth <= 768) {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sb) sb.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
        }

        if (window.MathJax && MathJax.typesetPromise && target) {
            MathJax.typesetPromise([target]).catch(function(err){});
        }
    }
    window.showSection = showSection;
    window.showTopic = showSection;

    function navigateSection(direction) {
        const sections = Array.from(document.querySelectorAll('section.page-section, section.topic-section'));
        if (!sections.length) return;

        let currentIndex = sections.findIndex(sec => sec.classList.contains('active') || sec.style.display === 'block');
        if (currentIndex === -1) currentIndex = 0;

        let targetIndex = currentIndex + direction;

        if (targetIndex >= 0 && targetIndex < sections.length) {
            const targetSecId = sections[targetIndex].id;
            showSection(targetSecId);
        }
    }
    window.navigateSection = navigateSection;

    function toggleAnswer(id) {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.classList.contains('show') || el.style.display === 'block') {
            el.classList.remove('show');
            el.style.display = 'none';
        } else {
            el.classList.add('show');
            el.style.display = 'block';
        }
    }
    window.toggleAnswer = toggleAnswer;
    window.toggleAnswers = toggleAnswer;
    window.toggleSetAnswers = toggleAnswer;

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        let overlay = document.getElementById('sidebar-overlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'sidebar-overlay';
            overlay.className = 'sidebar-overlay';
            overlay.onclick = toggleSidebar;
            document.body.appendChild(overlay);
        }
        if (sb) {
            sb.classList.toggle('open');
            if (sb.classList.contains('open')) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }
    }
    window.toggleSidebar = toggleSidebar;

    function toggleLanguage() {
        const btnText = document.getElementById('lang-toggle-text');
        const engContents = document.querySelectorAll('.english-content');
        const hinContents = document.querySelectorAll('.hinglish-content');
        
        if (window.currentLang === 'en') {
            if (btnText) btnText.innerHTML = '<i class="fas fa-language"></i> Switch Language (English)';
            engContents.forEach(el => el.style.display = 'none');
            hinContents.forEach(el => el.style.display = 'block');
            window.currentLang = 'hi';
        } else {
            if (btnText) btnText.innerHTML = '<i class="fas fa-language"></i> Switch Language (Hinglish)';
            hinContents.forEach(el => el.style.display = 'none');
            engContents.forEach(el => el.style.display = 'block');
            window.currentLang = 'en';
        }
    }
    window.toggleLanguage = toggleLanguage;
</script>
</head>
<body>
    <div class="container">
        <h1>Teacher's Pro Canvas</h1>
        <p>A multi-page digital notebook for mathematical derivations and statistical proofs.</p>
        <br>
        <button class="draw-mode-toggle" id="draw-mode-btn"><i class="fas fa-chalkboard"></i> Open Canvas</button>
        <br><br>
        <a href="../index.html" style="color: #6B6B70; text-decoration: none; font-size: 0.9rem;">&larr; Back to E-Books Library</a>
    </div>

    <!-- Whiteboard JS -->
    <script src="whiteboard.js?v=2.0">function toggleAnswer(id) { const el = document.getElementById(id); if(!el) return; if(el.style.display === "block") { el.style.display = "none"; } else { el.style.display = "block"; } }
window.toggleAnswer = toggleAnswer;
window.toggleAnswers = toggleAnswer;
window.toggleSetAnswers = toggleAnswer;
function toggleLanguage() { const btnText = document.getElementById("lang-toggle-text"); const engContents = document.querySelectorAll(".english-content"); const hinContents = document.querySelectorAll(".hinglish-content"); if (window.currentLang === "en") { if (btnText) btnText.innerHTML = "Switch Language (English)"; engContents.forEach(el => el.style.display = "none"); hinContents.forEach(el => el.style.display = "block"); window.currentLang = "hi"; } else { if (btnText) btnText.innerHTML = "Switch Language (Hinglish)"; hinContents.forEach(el => el.style.display = "none"); engContents.forEach(el => el.style.display = "block"); window.currentLang = "en"; } }
window.toggleLanguage = toggleLanguage;
</script>
    

</body>
</html>
